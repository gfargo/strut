name: Sync strut-action

# When a new strut release is published, tag gfargo/strut-action with the
# same version so consumers of @v1 pick up the matching strut CLI version.
# Also updates the default strut-version input to point at the new release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Fail with a readable message instead of actions/checkout's opaque
      # "Input required and not supplied: token". Without this the job died on
      # the checkout step for v0.43.3, v0.44.0 and v0.45.0 without anyone
      # noticing that strut-action had stopped being tagged entirely.
      - name: Verify STRUT_ACTION_PAT is configured
        env:
          STRUT_ACTION_PAT: ${{ secrets.STRUT_ACTION_PAT }}
        run: |
          if [ -z "${STRUT_ACTION_PAT}" ]; then
            echo "::error title=STRUT_ACTION_PAT missing::The secret STRUT_ACTION_PAT is unset or empty, so gfargo/strut-action cannot be checked out. This release will NOT be synced: strut-action keeps its previous strut-version default, gets no ${GITHUB_REF_NAME} tag, and its v1 tag stays where it is (so @v1 consumers do not track this release). Fix: create a PAT with contents:write on gfargo/strut-action and add it as the STRUT_ACTION_PAT repository secret, then re-run this workflow."
            exit 1
          fi

      - name: Checkout strut-action
        uses: actions/checkout@v4
        with:
          repository: gfargo/strut-action
          token: ${{ secrets.STRUT_ACTION_PAT }}
          path: strut-action
          fetch-depth: 0

      - name: Update default strut-version
        working-directory: strut-action
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"  # e.g. v0.30.4

          # Pin the strut-version default to this release tag.
          #
          # This used to be `sed s|default: 'latest'|default: '${TAG}'|`, which
          # could only ever fire ONCE: after the first sync the line reads
          # `default: 'v0.45.0'`, the literal no longer matches, nothing
          # changes, and the commit guard below skips. main then stops
          # advancing while tags keep being created — so @v1 consumers silently
          # stay pinned to whatever version synced first. Match the current
          # value instead of a literal, so every release re-pins.
          #
          # Scoped to the strut-version block: a blind `default:` rewrite would
          # also clobber command/port/working-directory.
          awk -v tag="$TAG" -v q="'" '
            /^  strut-version:/ { inblk = 1 }
            inblk && /^    default:/ { print "    default: " q tag q; inblk = 0; next }
            { print }
          ' action.yml > action.yml.tmp && mv action.yml.tmp action.yml

          grep -q "default: '${TAG}'" action.yml \
            || { echo "::error::failed to pin strut-version to ${TAG} in action.yml"; exit 1; }

          # Same idempotence problem in entrypoint.sh: match whatever version
          # is currently defaulted, not the literal 'latest'.
          sed -i -E "s|(strut_version=\"\\\$\{INPUT_STRUT_VERSION:-)[^}]*(\})|\1${TAG}\2|" entrypoint.sh

      - name: Commit, tag, and push
        working-directory: strut-action
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin strut-version default to ${TAG}

          Synced automatically from gfargo/strut release ${TAG}."
            git push origin main
          fi

          # Create the exact version tag matching the strut release.
          # -f/--force so re-running a sync (after fixing it, or after a failed
          # run left a tag pointing at the wrong commit) succeeds instead of
          # dying on "tag already exists".
          git tag -fa "$TAG" -m "strut-action ${TAG} (synced from gfargo/strut)"
          git push -f origin "$TAG"

          # Move the major tag (v1) so @v1 consumers get automatic updates
          git tag -fa v1 -m "strut-action v1 -> ${TAG}"
          git push -f origin v1

      # Tags alone leave the Releases page looking frozen — it still showed
      # v1.0.0 from July while v0.45.x tags were being pushed, so there was no
      # visible signal that a sync had happened at all.
      - name: Publish a matching GitHub Release
        working-directory: strut-action
        env:
          GH_TOKEN: ${{ secrets.STRUT_ACTION_PAT }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="Synced from [gfargo/strut ${TAG}](https://github.com/gfargo/strut/releases/tag/${TAG}).

          Pins the action's \`strut-version\` default to \`${TAG}\`. \`@v1\` now resolves here."

          if gh release view "$TAG" --repo gfargo/strut-action >/dev/null 2>&1; then
            gh release edit "$TAG" --repo gfargo/strut-action --notes "$NOTES" --latest
          else
            gh release create "$TAG" --repo gfargo/strut-action \
              --title "$TAG" --notes "$NOTES" --latest
          fi
